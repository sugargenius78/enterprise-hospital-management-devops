{% extends "base.html" %}

{% block content %}

<div class="container mt-3">
    <h3 class="text-center mb-4">Edit Bill: {{ bill.bill_number }}</h3>
    
    <div class="row justify-content-center">
        <div class="col-md-8">
            <form method="POST">
                
                <div class="mb-3">
                    <label class="form-label">Bill Type</label>
                    <select name="bill_type" class="form-select" required>
                        <option value="Consultation" {% if bill.bill_type == 'Consultation' %}selected{% endif %}>Consultation</option>
                        <option value="Admission" {% if bill.bill_type == 'Admission' %}selected{% endif %}>Admission</option>
                        <option value="Medicine" {% if bill.bill_type == 'Medicine' %}selected{% endif %}>Medicine</option>
                        <option value="Lab Test" {% if bill.bill_type == 'Lab Test' %}selected{% endif %}>Lab Test</option>
                        <option value="Surgery" {% if bill.bill_type == 'Surgery' %}selected{% endif %}>Surgery</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input type="number" step="0.01" name="amount" value="{{ bill.amount }}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3">{{ bill.description or '' }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Update Bill</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
