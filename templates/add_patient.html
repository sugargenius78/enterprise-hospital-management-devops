{% extends "base.html" %}
{% block content %}
<div class="container mt-1">
    <h3 class="text-center">Welcome to Patient Module -- Add Patient</h3>
</div>
<div class="conatiner-fluid bg-danger-subtle">
    <form method="POST" class="container p-3">

        <div class="mb-2 mx-2">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-2 mx-2">
            <label>Age</label>
            <input type="number" name="age" class="form-control" required>
        </div>

        <div class="mb-2 mx-2">
            <label>Phone Number</label>
            <input type="text" name="phone" class="form-control" required>
        </div>

        <div class="mb-3 mx-2">
            <label>Address</label>
            <input type="text" name="address" class="form-control required">
        </div>

        <button type="submit" class="btn btn-success ms-2">Save</button>

    </form>
</div>
{% endblock %}
