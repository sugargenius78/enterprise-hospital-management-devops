{% extends "base.html" %}
{% block content %}
<div class="container mt-1">
    <h3 class="text-center">Welcome to Patient Module -- Update & View Patient</h3>
</div>
<div class="container mx-2">
    <table class="table table-bordered table-striped mt-3">
        <thread>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Action</th>
            </tr>
        </thread>
        <tbody>
            {% for p in patients %}
            <tr>
                <td>{{ p.id }}</td>
                <td>{{ p.name }}</td>
                <td>{{ p.age }}</td>
                <td>{{ p.phone }}</td>
                <td>{{ p.address }}</td>
                <td>
                    <a href="/edit_patient/{{ p.id }}" class="btn btn-warning btn-sm">Edit</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
