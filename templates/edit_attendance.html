{% extends "base.html" %}

{% block content %}

<h3 class="text-center">Edit Attendance Record</h3>

<form method="POST">

    <div class="mb-2">
        <label>Employee</label>
        <select name="employee_id" class="form-control" required>
            {% for e in employees %}
            <option value="{{ e.id }}" {% if e.id == attendance.employee_id %}selected{% endif %}>
                {{ e.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-2">
        <label>Date</label>
        <input type="date" name="date" value="{{ attendance.date }}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Status</label>
        <select name="status" class="form-control" required>
            <option value="Present" {% if attendance.status == 'Present' %}selected{% endif %}>Present</option>
            <option value="Absent" {% if attendance.status == 'Absent' %}selected{% endif %}>Absent</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Update</button>
    <a href="/view_update_attendance" class="btn btn-secondary">Cancel</a>

</form>

{% endblock %}
