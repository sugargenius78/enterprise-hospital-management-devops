{% extends "base.html" %}

{% block content %}
<div class="container mt-1">
    <h3 class="text-center">Welcome to Patient Module -- Edit Patient</h3>
</div>
<div class="container-fluid mt-1 py-5 bg-danger-subtle">
    <div class="container">
        <form method="POST">
            <div class="mb-2">
                <label>Name</label>
                <input type="text" name="name" value="{{ patient.name }}" class="form-control" required>
            </div>
            <div class="mb-2">
                <label>Age</label>
                <input type="number" name="age" value="{{ patient.age }}" class="form-control" required>
            </div>
            <div class="mb-2">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ patient.phone }}" class="form-control" required>
            </div>
            <div class="mb-2">
                <label>Address</label>
                <input type="text" name="address" value="{{ patient.address }}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-danger">Update</button>
        </form>
    </div>
</div>

{% endblock %}
