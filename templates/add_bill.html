{% extends "base.html" %}

{% block content %}

<div class="container mt-3">
    <h3 class="text-center mb-4">Create New Bill</h3>
    
    <div class="row justify-content-center">
        <div class="col-md-8">
            <form method="POST">
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Patient ID</label>
                        <input type="number" name="patient_id" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Patient Name</label>
                        <input type="text" name="patient_name" class="form-control" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Bill Type</label>
                        <select name="bill_type" class="form-select" required>
                            <option value="Consultation">Consultation</option>
                            <option value="Admission">Admission</option>
                            <option value="Medicine">Medicine</option>
                            <option value="Lab Test">Lab Test</option>
                            <option value="Surgery">Surgery</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Amount</label>
                        <input type="number" step="0.01" name="amount" class="form-control" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="Pending">Pending</option>
                            <option value="Paid">Paid</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Payment Method</label>
                        <select name="payment_method" class="form-select">
                            <option value="">Select</option>
                            <option value="Cash">Cash</option>
                            <option value="Card">Card</option>
                            <option value="Insurance">Insurance</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-success w-100">Create Bill</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
